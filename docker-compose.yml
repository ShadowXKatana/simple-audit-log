services:
  # ==========================================
  # Profile: infra (Core Infrastructure)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: al-kafka
    hostname: kafka
    profiles: ['infra']
    ports:
      - '9092:9092'
      - '7071:7071' # JMX
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 'audit-log-cluster-id'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 7071
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - audit-net
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9092 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: al-schema-registry
    profiles: ['infra']
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - audit-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8081 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: al-elasticsearch
    profiles: ['infra']
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - audit-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: al-minio
    profiles: ['infra']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - audit-net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc alias set hc http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready hc || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: al-minio-init
    profiles: ['infra']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/audit-log-archive || true;
      mc anonymous set public local/audit-log-archive;
      exit 0;
      "
    networks:
      - audit-net

  # ==========================================
  # Profile: consumer (Kafka Connect)
  # ==========================================
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.7.1
    container_name: al-kafka-connect
    profiles: ['consumer']
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '8083:8083'
      - '7072:7072'
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components'
      KAFKA_HEAP_OPTS: '-Xms512m -Xmx768m'
    volumes:
      - ./consumer/plugins:/usr/share/confluent-hub-components
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - audit-net

  # ==========================================
  # Profile: apps (UI & Producer API)
  # ==========================================
  producer-api:
    build:
      context: ./apps/producer
    container_name: al-producer-api
    profiles: ['apps']
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: audit-log
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ES_URL: http://elasticsearch:9200
      CONNECT_URL: http://kafka-connect:8083
      API_PORT: 8080
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - audit-net

  ui:
    build:
      context: ./apps/ui
    container_name: al-ui
    profiles: ['apps']
    depends_on:
      - producer-api
    ports:
      - '3001:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - audit-net

  # ==========================================
  # Profile: monitor (Prometheus, Grafana)
  # ==========================================
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: al-es-exporter
    profiles: ['monitor']
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
    ports:
      - '9114:9114'
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - audit-net

  prometheus:
    image: prom/prometheus:latest
    container_name: al-prometheus
    profiles: ['monitor']
    ports:
      - '9090:9090'
    volumes:
      - ./monitor/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - audit-net

  grafana:
    image: grafana/grafana:latest
    container_name: al-grafana
    profiles: ['monitor']
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - audit-net

networks:
  audit-net:
    driver: bridge

volumes:
  kafka-data:
  es-data:
  minio-data:
  prometheus-data:
  grafana-data:
